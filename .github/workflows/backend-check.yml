name: Backend check
on:
  push:
    branches: ["**"]
    paths: ["backend/**"]
  pull_request:
    paths: ["backend/**"]
  workflow_dispatch:
jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Check backend syntax
        working-directory: backend
        run: npm run check
