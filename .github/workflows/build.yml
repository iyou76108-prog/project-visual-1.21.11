name: Build
on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install global service dependencies
        run: npm install --prefix server --no-audit --no-fund
      - name: Check global service syntax
        run: node --check server/src/server.js
      - name: Test global service accounts and chess matches
        run: npm test --prefix server

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Build mod
        run: gradle build --no-daemon
      - name: Upload testable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: project-visual-0.1.0
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
